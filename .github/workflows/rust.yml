name: Rust

on:
  pull_request:
  push:
    branches: ["master"]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-04-15
          components: rustfmt, clippy, llvm-tools-preview
      - name: Install external check tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,cargo-machete,cargo-audit,cargo-nextest
      - name: Install Lockpick
        run: cargo install --git https://github.com/Kuenlun/lockpick --rev 87116062372b37c5a793acb10d662343096c8985 --locked lockpick
      - name: Run checks
        run: lockpick -v
      - name: Test performance comparison helper
        if: runner.os == 'Linux'
        run: python3 -B benches/test_compare.py

  merge-gate:
    runs-on: ubuntu-latest
    needs: [check]
    if: always()
    steps:
      - name: Check results
        run: |
          if [[ "${{ needs.check.result }}" != "success" ]]; then
            echo "::error::Check failed: ${{ needs.check.result }}"
            exit 1
          fi
