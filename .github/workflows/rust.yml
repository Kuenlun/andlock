name: Rust

on:
  pull_request:
    branches: ["master", "develop"]
  push:
    branches: ["master"]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-04-15
          components: rustfmt, clippy, llvm-tools-preview
      - name: Install lockpick
        uses: taiki-e/install-action@v2
        with:
          tool: lockpick,cargo-llvm-cov,cargo-machete,cargo-audit,cargo-nextest
      - name: Run checks
        run: lockpick -v --skip coverage

  merge-gate:
    runs-on: ubuntu-latest
    needs: [check]
    if: always()
    steps:
      - name: Check results
        run: |
          if [[ "${{ needs.check.result }}" != "success" ]]; then
            echo "::error::Check failed: ${{ needs.check.result }}"
            exit 1
          fi
