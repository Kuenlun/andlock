[package]
name = "andlock"
version = "0.3.0"
edition = "2024"
description = "Count Android-style unlock patterns on n-dimensional grids"
repository = "https://github.com/Kuenlun/andlock"
authors = ["Juan Luis Leal Contreras <kuenlunleal@gmail.com>"]
license = "MIT OR Apache-2.0"
keywords = ["android", "pattern", "unlock", "combinatorics", "counter"]
categories = ["algorithms", "command-line-utilities", "mathematics"]

[package.metadata.lockpick]
license-header = ".github/license_header.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
clap-cargo = { version = "0.18", default-features = false, features = ["clap"] }
clap_complete = "4"
console = "0.16"
ctrlc = "3"
indicatif = "0.18"
parse-size = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sysinfo = { version = "0.39", default-features = false, features = [
    "system",
] }

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
portable-pty = "0.9"
vt100 = "0.16"

[[bench]]
name = "dp"
harness = false
test = false

[lints.rust]
unsafe_code = "forbid"
warnings = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage_nightly)'] }

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "debuginfo"
debug = false
