[package]
name = "andlock"
version = "0.5.0"
edition = "2024"
description = "Count Android-style unlock patterns on n-dimensional grids"
repository = "https://github.com/Kuenlun/andlock"
authors = ["Juan Luis Leal Contreras <kuenlunleal@gmail.com>"]
license = "MIT OR Apache-2.0"
keywords = ["android", "pattern", "unlock", "combinatorics", "counter"]
categories = ["algorithms", "command-line-utilities", "mathematics"]

[package.metadata.lockpick]
license-header = ".github/license_header.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
clap-cargo = { version = "0.18", default-features = false, features = ["clap"] }
clap_complete = "4"
console = "0.16"
ctrlc = "3"
indicatif = "0.18"
num-bigint = { version = "0.5", default-features = false }
parse-size = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sysinfo = { version = "0.39", default-features = false, features = [
    "system",
] }

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
portable-pty = "0.9"
vt100 = "0.16"

[[bench]]
name = "dp"
harness = false
test = false

[lints.rust]
warnings = "deny"
unsafe_code = "deny"
unexpected_cfgs = { level = "deny", check-cfg = ['cfg(coverage_nightly)'] }
unsafe_op_in_unsafe_fn = "forbid"
let_underscore_drop = "deny"
non_ascii_idents = "deny"
missing_docs = "deny"
missing_debug_implementations = "deny"
unreachable_pub = "deny"
unused_crate_dependencies = "deny"
unused_results = "deny"
unused_qualifications = "deny"
unused_lifetimes = "deny"
elided_lifetimes_in_paths = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
variant_size_differences = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
# Prefer explicit pub(crate) visibility
redundant_pub_crate = "allow"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
arithmetic_side_effects = "deny"
as_conversions = "deny"
dbg_macro = "deny"
default_numeric_fallback = "deny"
exit = "deny"
expect_used = "deny"
get_unwrap = "deny"
indexing_slicing = "deny"
let_underscore_must_use = "deny"
lossy_float_literal = "deny"
mem_forget = "deny"
panic = "deny"
print_stderr = "deny"
print_stdout = "deny"
rc_buffer = "deny"
rc_mutex = "deny"
rest_pat_in_fully_bound_structs = "deny"
string_slice = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"
unreachable = "deny"
unseparated_literal_suffix = "deny"
unwrap_used = "deny"
wildcard_enum_match_arm = "deny"

[lints.rustdoc]
all = { level = "deny", priority = -1 }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "debuginfo"
debug = false
